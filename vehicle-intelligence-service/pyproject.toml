[project]
name = "ford-vehicle-intelligence"
version = "1.0.0"
description = "Vehicle evaluation and maintenance recommendation API for Ford Zero Touch"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "pymongo>=4.14,<5",
  "redis>=6.4,<7",
  "structlog>=25.4,<26",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ford_intelligence"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q --cov=ford_intelligence --cov-report=term-missing --cov-report=xml"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
omit = ["src/ford_intelligence/main.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"] # FastAPI dependency injection is intentionally declared in defaults.
