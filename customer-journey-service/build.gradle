plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.com.fiap.ford'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories { mavenCentral() }

dependencyLocking { lockAllConfigurations() }

// SCA (Trivy): o Spring Boot 3.5.16 traz Tomcat 10.1.55, Netty 4.1.135 e pgjdbc 42.7.11, com CVEs
// críticas e altas já corrigidas upstream. Fixa o patch mais recente de cada linha (>= versão corrigida)
// até um patch do Boot absorvê-los.
ext['tomcat.version'] = '10.1.60'
ext['netty.version'] = '4.1.138.Final'
ext['postgresql.version'] = '42.7.13'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.3.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco { toolVersion = '0.8.13' }

def coveredClasses = files(sourceSets.main.output).asFileTree.matching {
    exclude '**/infra/**', '**/*Application.class', '**/*Config.class'
}

jacocoTestReport {
    dependsOn test
    classDirectories.setFrom(coveredClasses)
    reports { xml.required = true; html.required = true }
}
