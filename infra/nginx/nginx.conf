events {}

http {
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  # Login: 5 req/min por IP (rajada de 10). Somado ao bloqueio de conta da aplicação,
  # limita força bruta e credential stuffing sem travar o uso normal.
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_req_status 429;
  # Retry-After só no 429 (Nginx omite cabeçalho vazio). Fica no server porque um add_header
  # dentro de location anularia os cabeçalhos de segurança herdados.
  map $status $retry_after {
    429 60;
    default "";
  }
  server_tokens off;

  upstream journey { server customer-journey:8080; }
  upstream intelligence { server vehicle-intelligence:8000; }
  upstream workshop { server workshop-operations:8080; }

  server {
    listen 8080;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Retry-After $retry_after always;
    error_page 429 = @too_many_requests;

    location @too_many_requests {
      default_type application/problem+json;
      return 429 '{"type":"https://ford.example/problems/429","title":"Too Many Requests","status":429,"detail":"Rate limit exceeded. Retry later.","instance":"$request_uri"}';
    }

    location = /journey/api/v1/auth/token {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://journey/api/v1/auth/token;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /journey/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://journey/;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /intelligence/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://intelligence/;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /workshop/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://workshop/;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}

